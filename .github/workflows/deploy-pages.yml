# Site vitrine : export statique GitHub Pages (domaine phantomdev.fr).
# L'audit Stripe (/api/audit) n'est pas inclus dans cet export.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        env:
          GITHUB_PAGES: "true"
          NODE_OPTIONS: "--max-old-space-size=4096"
          NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          NEXT_PUBLIC_FORMSPREE_ID: xjgalddw
        run: |
          rm -rf .next out src/app/api
          npm run build
          cp CNAME out/CNAME
          touch out/.nojekyll

      - name: List deployed files
        run: |
          echo "Contenu de out/ déployé :"
          ls -la out/
          test -f out/index.html
          test -f out/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
